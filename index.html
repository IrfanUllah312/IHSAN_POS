<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
  if (sessionStorage.getItem('ihsan_auth_session') !== 'true') {
    window.location.href = 'login.html?redirect=' + encodeURIComponent(location.pathname.split('/').pop());
  }
</script>
<title>Dashboard · IHSAN TRADERS</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="shell-sidebar"></aside>
  <main class="main">
    <div class="topbar" id="shell-topbar"></div>

    <div class="grid grid-4" id="stat-cards"></div>

    <div class="grid grid-2" style="margin-top:18px;">
      <div class="card">
        <div class="card-head">
          <h2>Recent Invoices</h2>
          <a href="invoice.html" class="btn btn-primary btn-sm">+ New Invoice</a>
        </div>
        <table class="data">
          <thead>
            <tr><th>Invoice #</th><th>Customer</th><th>Date</th><th class="text-right">Total</th><th>Status</th></tr>
          </thead>
          <tbody id="recent-invoices"></tbody>
        </table>
      </div>

      <div class="card">
        <div class="card-head"><h2>Low Stock</h2><a href="inventory.html" class="btn btn-outline btn-sm">Manage</a></div>
        <table class="data">
          <thead><tr><th>Item</th><th class="text-right">Stock</th></tr></thead>
          <tbody id="low-stock-list"></tbody>
        </table>
      </div>
    </div>

    <div class="card" style="margin-top:18px;">
      <h2>Quick Actions</h2>
      <div class="grid grid-4" style="margin-top:12px;">
        <a href="invoice.html" class="btn btn-primary btn-block">New Invoice</a>
        <a href="inventory.html" class="btn btn-outline btn-block">Add Inventory</a>
        <a href="dues.html" class="btn btn-outline btn-block">Record Payment</a>
        <a href="settings.html" class="btn btn-outline btn-block">Sync to Sheet</a>
      </div>
    </div>
  </main>
</div>

<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/shell.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
